# --- 410 Gone: artefactos de WordPress sin ningún equivalente (adjuntos,
# uploads, hooks del tema Astra) -- un wildcard por prefijo en vez de una
# regla por cada una de las ~110 URLs individuales de la hoja de migración,
# ya que dentro de cada prefijo el 100% de las filas es 410 sin excepción. ---

[[redirects]]
  from = "/media/*"
  to = "/410"
  status = 410

[[redirects]]
  from = "/wp-content/uploads/*"
  to = "/410"
  status = 410

[[redirects]]
  from = "/astra-advanced-hook/*"
  to = "/410"
  status = 410

# Cloudflare suele interceptar /cdn-cgi/* antes de que llegue a Netlify (es
# su propio artefacto de ofuscación de emails) -- esta regla es un respaldo,
# no garantía de que aplique.
[[redirects]]
  from = "/cdn-cgi/l/email-protection"
  to = "/410"
  status = 410